<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"><link rel="stylesheet" href="css/base.css"><title>Ingresar - La Gambeta</title></head>
<body class="login"><main class="login-caja">
<img src="assets/logo.png" alt="La Gambeta, escuela de fútbol Paysandú" width="140" height="140"><h1>Ingresar</h1>
<form id="form" novalidate>
<label>Correo<input id="email" type="email" autocomplete="username" required></label>
<label>Contraseña<input id="clave" type="password" autocomplete="current-password" required></label>
<p id="error" class="error" role="alert" hidden></p><button class="btn" id="enviar">Entrar</button></form></main>
<script type="module" src="js/modules/login.js"></script></body></html>
